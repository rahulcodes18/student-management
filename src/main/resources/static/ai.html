<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .ai-container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            box-sizing: border-box;
            resize: none;
            margin-top: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #answer {
            margin-top: 25px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 8px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="ai-container">

    <h1>🤖 AI Assistant</h1>

    <textarea
        id="question"
        placeholder="Ask something...">
    </textarea>

    <button onclick="askAI()">
        Ask AI
    </button>

    <div id="answer">
        AI answer will appear here...
    </div>

</div>

<script>

async function askAI() {

    const question =
        document.getElementById("question").value;

    const answer =
        document.getElementById("answer");

    if (!question.trim()) {
        answer.innerText = "Please enter a question.";
        return;
    }

    answer.innerText = "🤖 AI is thinking...";

    try {

        const response = await fetch(
            "/api/ai/ask",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    question: question
                })
            }
        );

        const data = await response.text();

        answer.innerText = data;

    } catch (error) {

        answer.innerText =
            "❌ Error connecting to AI.";

        console.error(error);
    }
}

</script>

</body>
</html>
